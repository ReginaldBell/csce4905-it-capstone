{% extends "base.html" %}
{% from '_forms.html' import describe, form_error %}
{% block title %}Log in — Pet Finder{% endblock %}
{% block content %}
<h1>Log in</h1>

{{ form_error(errors) }}

<form class="stacked-form" method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required autofocus{{ describe(errors, 'email', form_error=True) }}>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required{{ describe(errors, 'password', form_error=True) }}>
  </div>

  <button type="submit" class="btn">Log in</button>
</form>

<p><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
<p>Need an account? <a href="{{ url_for('auth.register') }}">Register</a>.</p>
{% endblock %}
