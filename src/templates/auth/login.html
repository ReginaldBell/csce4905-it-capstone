{% extends "base.html" %}
{% block title %}Log in — Pet Finder{% endblock %}
{% block content %}
<h1>Log in</h1>

{% if errors.get('form') %}<p class="form-error">{{ errors['form'] }}</p>{% endif %}

<form class="stacked-form" method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>

  <button type="submit" class="btn">Log in</button>
</form>

<p>Need an account? <a href="{{ url_for('auth.register') }}">Register</a>.</p>
{% endblock %}
