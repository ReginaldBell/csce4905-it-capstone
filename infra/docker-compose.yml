services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petfinder
      POSTGRES_PASSWORD: petfinder
      POSTGRES_DB: petfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://petfinder:petfinder@db:5432/petfinder
      SECRET_KEY: dev-secret-key-change-me
      FLASK_DEBUG: "1"
    ports:
      - "5000:5000"
    volumes:
      # Bind-mount the app source for live reload in dev; uploaded photos
      # land in ../src/static/uploads on the host as a side effect.
      - ../src:/app/src

volumes:
  pgdata:
